# Wystawia aplikację pod adresem HTTPS: https://kajetan98.github.io/MediTagHero/
# Bez tego zapis opaski wymaga serwera na własnym komputerze, bo Web NFC działa wyłącznie
# w bezpiecznym kontekście.
#
# Wdrożenie idzie przez gałąź gh-pages, nie przez actions/deploy-pages: token przepływu nie ma
# w tym repozytorium prawa przestawić Pages na budowanie z Actions (odpowiada 403 na próbie),
# a do wypchnięcia gałęzi wystarcza `contents: write`.
#
# Pod tym adresem nie ma API HERO, więc aplikacja schodzi do trybu bez serwera: karty leżą
# w pamięci przeglądarki, która je założyła. Do zapisania opaski i odczytania jej tym samym
# telefonem to wystarcza; karta widoczna z cudzego telefonu wymaga serwera.
name: strona

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

# Jedno wdrożenie naraz; kolejnego pchnięcia nie przerywamy w połowie.
concurrency:
  group: strona
  cancel-in-progress: false

jobs:
  wystaw:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      # public/index.html jest w repozytorium, ale budujemy je jeszcze raz, żeby na stronie
      # nie wylądowała wersja rozjechana z web/app.html.
      - run: npm run build
      - name: Wypchnij zawartość public/ na gałąź gh-pages
        env:
          # Adres z tokenem trzymamy w zmiennej, żeby nie wyciekł do dziennika w treści polecenia.
          ADRES: https://x-access-token:${{ secrets.GITHUB_TOKEN }}@github.com/${{ github.repository }}.git
        run: |
          set -eu
          katalog="$(mktemp -d)"
          # Historia gałęzi zostaje: dopisujemy wdrożenie, nie przepisujemy jej od nowa.
          git clone --quiet --depth 1 --branch gh-pages "$ADRES" "$katalog"
          find "$katalog" -mindepth 1 -maxdepth 1 -not -name .git -exec rm -rf {} +
          cp -r public/. "$katalog/"
          # .nojekyll: bez niego Pages przepuszcza treść przez Jekylla i gubi pliki od podkreślnika.
          touch "$katalog/.nojekyll"
          cd "$katalog"
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          if git diff --quiet --cached; then
            echo "Strona jest już aktualna — nie ma czego wypychać."
            exit 0
          fi
          git commit --quiet -m "Strona z ${GITHUB_SHA}"
          git push --quiet origin gh-pages
          echo "Wystawione: https://${GITHUB_REPOSITORY_OWNER}.github.io/${GITHUB_REPOSITORY#*/}/"
