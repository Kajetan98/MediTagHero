# Wystawia aplikację pod adresem HTTPS na GitHub Pages. Bez tego zapis opaski wymaga serwera
# uruchomionego na własnym komputerze, bo Web NFC działa wyłącznie w bezpiecznym kontekście.
#
# Pod tym adresem nie ma API HERO, więc aplikacja schodzi do trybu bez serwera: karty leżą
# w pamięci przeglądarki, która je założyła. Do zapisania opaski i odczytania jej tym samym
# telefonem to wystarcza; karta widoczna z cudzego telefonu wymaga serwera.
name: strona

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

# Jedno wdrożenie naraz; kolejnego pchnięcia nie przerywamy w połowie.
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  wystaw:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.wdrozenie.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      # public/index.html jest w repozytorium, ale budujemy je jeszcze raz, żeby na stronie
      # nie wylądowała wersja rozjechana z web/app.html.
      - run: npm run build
      # Token przepływu nie zawsze ma prawo włączyć Pages w repozytorium. Gdy nie ma, nie wywracamy
      # przebiegu na czerwono — wypisujemy, co kliknąć, i pomijamy wdrożenie do następnego razu.
      - id: pages
        uses: actions/configure-pages@v5
        continue-on-error: true
        with:
          enablement: true
      - if: steps.pages.outcome != 'success'
        run: |
          echo "::warning::GitHub Pages nie jest włączone dla tego repozytorium, więc nie ma dokąd wystawić strony."
          echo "Włącza się je raz: Settings → Pages → Build and deployment → Source: GitHub Actions."
          echo "Potem wystarczy uruchomić ten przepływ ponownie (Actions → strona → Run workflow)."
      - if: steps.pages.outcome == 'success'
        uses: actions/upload-pages-artifact@v3
        with:
          path: public
      - id: wdrozenie
        if: steps.pages.outcome == 'success'
        uses: actions/deploy-pages@v4
